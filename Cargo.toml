[workspace]
resolver = "3"
members = ["crates/sdk", "crates/cli"]

[workspace.package]
version = "0.2.11"
edition = "2024"
license = "MIT"
repository = "https://github.com/PerplFoundation/dex-sdk"

[workspace.dependencies]
alloy = { version = "2.5.0", default-features = false, features = [
  "contract",
  "eips",
  "provider-http",
  "reqwest",
  "reqwest-rustls-tls",
  "rpc",
  "rpc-client",
  "rpc-types",
  "transport-throttle",
] }
alloy-sol-types = { version = "1.7.3", default-features = false, features = [
  "more-tuple-impls",
] }
anyhow = { version = "1.0.104" }
chrono = { version = "0.4.45", default-features = false, features = ["alloc"] }
clap = { version = "4.6.7", features = ["derive"] }
colored = { version = "3.1.1" }
crossterm = { version = "0.29.0" }
dashmap = { version = "6.2.1" }
derive_more = { version = "2.1.1", default-features = false, features = [
  "debug",
] }
fastnum = { version = "0.7.5" }
futures = { version = "0.3.34" }
itertools = { version = "0.15.0" }
tabled = { version = "0.22.0", features = ["ansi"] }
thiserror = { version = "2.0.20" }
tokio = { version = "1.53.1", features = [
  "sync",
  "rt-multi-thread",
  "macros",
  "time",
] }
tokio-util = { version = "0.7.19" }

# Not used directly: floors for the whole dependency graph. rustls-webpki
# 0.103.16 is the first release that rejects a certificate path through the
# compromised eMudhra (emSign) intermediates of October 2026, and
# webpki-root-certs 1.0.10 drops the root that signed them. Nothing above them
# requires either yet (rustls 0.23.46 accepts 0.103.14), and a library's
# lockfile reaches no consumer -- so without these, a downstream lockfile keeps
# whatever it resolved first, and only a floor here moves it on upgrade.
rustls-webpki = { version = "0.103.16", default-features = false }
webpki-root-certs = { version = "1.0.10" }
