name: CI

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    if: "!contains(github.event.head_commit.message, 'Bump version to v')"
    steps:
      - name: Check PR branch
        if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref != 'dev'
        run: |
          echo "Pull requests to main must come from dev branch."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: 1.97
          components: rustfmt, clippy

      - name: Install Rust Nightly
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: nightly-2026-08-22
          components: rustfmt, clippy

      - name: Install Monad Foundry
        run: |
          curl -L \
            https://github.com/category-labs/foundry/releases/download/v1.5.0-monad.0.2.0/foundry_v1.5.0-monad.0.2.0_linux_amd64.tar.gz \
            -o /tmp/foundry.tar.gz

          tar -xzf /tmp/foundry.tar.gz -C /tmp

          sudo mv /tmp/forge /usr/local/bin/forge
          sudo mv /tmp/cast /usr/local/bin/cast
          sudo mv /tmp/anvil /usr/local/bin/anvil
          sudo mv /tmp/chisel /usr/local/bin/chisel
          anvil --version

      - name: Machete
        uses: bnjbvr/cargo-machete@ac30a525c0a8d163a92d727b3ff079ee3f6ecb08

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format
        run: make fmt

      - name: Lint
        run: make lint

      - name: Check code is up to date
        run: git diff --exit-code

      - name: Build
        run: make build

      - name: Test
        run: make test

