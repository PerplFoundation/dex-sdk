name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97
          components: rustfmt, clippy
      - name: Install Monad Foundry
        run: |
          curl -L \
            https://github.com/category-labs/foundry/releases/download/v1.5.0-monad.0.2.0/foundry_v1.5.0-monad.0.2.0_linux_amd64.tar.gz \
            -o /tmp/foundry.tar.gz

          tar -xzf /tmp/foundry.tar.gz -C /tmp

          sudo mv /tmp/forge /usr/local/bin/forge
          sudo mv /tmp/cast /usr/local/bin/cast
          sudo mv /tmp/anvil /usr/local/bin/anvil
          sudo mv /tmp/chisel /usr/local/bin/chisel
          anvil --version

      - name: Machete
        uses: bnjbvr/cargo-machete@main

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format
        run: make fmt

      - name: Lint
        run: make lint

      - name: Check code is up to date
        run: git diff --exit-code

      - name: Build
        run: make build

      - name: Test
        run: make test

