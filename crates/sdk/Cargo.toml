[package]
name = "perpl-sdk"
description = "Rust SDK for the Perpl decentralized perpetuals exchange"
build = "build.rs"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
alloy.workspace = true
alloy-sol-types.workspace = true
chrono.workspace = true
colored = { workspace = true, optional = true }
dashmap.workspace = true
derive_more.workspace = true
fastnum.workspace = true
futures.workspace = true
itertools.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tabled = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }
# Version floors only; see the workspace manifest.
rustls-webpki.workspace = true
webpki-root-certs.workspace = true

[dev-dependencies]
alloy = { workspace = true, features = [
  "network",
  "node-bindings",
  "signer-local",
] }
tabled = { workspace = true }
tokio = { workspace = true }

[features]
default = ["display", "testing"]
display = ["tabled", "colored"]
# Separate from `testing` (which is in `default` and enables alloy/node-bindings)
# so that downstream crates can opt in to test builders (Perpetual::for_test,
# with_bid, with_ask, etc.) via dev-dependencies without exposing internal
# mutation methods in production builds.
test-utils = []
testing = ["alloy/node-bindings"]
# WebSocket subscriptions for `stream::EventSource::with_ws_url`. Off by
# default: the polling-only event source needs none of it.
# `provider-ws-ring`, not `provider-ws`: the latter brings aws-lc-rs in as the
# process-wide rustls provider, whose post-quantum key share breaks the TLS
# handshake with the public testnet RPC endpoint (connection reset), taking
# the HTTP provider down with it.
ws = ["alloy/pubsub", "alloy/provider-ws-ring", "dep:serde", "dep:serde_json", "dep:tokio"]

[package.metadata.cargo-machete]
ignored = ["alloy-sol-types", "rustls-webpki", "webpki-root-certs"]